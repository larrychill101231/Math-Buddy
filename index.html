<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Math Buddy - Calculator</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#001a42",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-tint": "#005ac2",
                        "primary": "#0058be",
                        "surface-variant": "#d3e4fe",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "secondary": "#585f67",
                        "on-secondary-container": "#5e656d",
                        "outline-variant": "#c2c6d6",
                        "tertiary-container": "#a36700",
                        "on-primary-fixed-variant": "#004395",
                        "surface-dim": "#cbdbf5",
                        "secondary-fixed": "#dce3ec",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "on-background": "#0b1c30",
                        "inverse-on-surface": "#eaf1ff",
                        "surface": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "surface-container-low": "#eff4ff",
                        "secondary-container": "#dce3ec",
                        "inverse-surface": "#213145",
                        "secondary-fixed-dim": "#c0c7d0",
                        "tertiary": "#825100",
                        "outline": "#727785",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary-fixed-variant": "#40484f",
                        "on-tertiary-container": "#fffbff",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#151c23",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-tertiary-fixed": "#2a1700",
                        "on-surface": "#0b1c30",
                        "surface-bright": "#f8f9ff",
                        "primary-container": "#2170e4",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#ffddb8",
                        "background": "#f8f9ff",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "inverse-primary": "#adc6ff",
                        "on-primary-container": "#fefcff",
                        "on-surface-variant": "#424754",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "button-gap": "12px",
                        "gutter": "12px",
                        "margin-desktop": "40px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "display-sm": ["Inter"],
                        "button-text": ["Inter"],
                        "label-md": ["Inter"],
                        "history-text": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-sm": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "button-text": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "label-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "history-text": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-display-sm">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background w-full top-0 border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile h-16 shrink-0">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="calculate">calculate</span>
<h1 class="font-display-sm text-display-sm font-semibold text-primary dark:text-primary-fixed leading-none text-xl">Math Buddy</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center p-4 gap-8 overflow-y-auto">
<!-- Calculator Container -->
<div class="w-full max-w-sm bg-surface-container-low rounded-xl shadow-sm border border-outline-variant p-4 flex flex-col gap-4">
<!-- Error Toast (Hidden by default) -->
<div class="hidden bg-error-container text-on-error-container font-label-md text-label-md px-4 py-2 rounded-lg text-center transition-opacity duration-300" id="error-toast">
                Invalid Expression
            </div>
<!-- Display Area -->
<div class="bg-surface-container-highest rounded-lg p-4 flex flex-col items-end justify-end h-32 border border-outline-variant shadow-inner relative overflow-hidden">
<div class="font-history-text text-history-text text-on-surface-variant w-full text-right truncate min-h-[28px]" id="history-display"></div>
<div class="font-display-lg text-display-lg text-on-surface w-full text-right truncate" id="main-display">0</div>
</div>
<!-- Keypad Grid -->
<div class="grid grid-cols-4 gap-button-gap">
<!-- Row 1 -->
<button class="col-span-2 bg-error text-on-error font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-opacity-90 active:scale-95 transition-all" onclick="appendValue('C')">C</button>
<button class="bg-surface-variant text-on-surface-variant font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-high active:scale-95 transition-all" onclick="appendValue('(')">(</button>
<button class="bg-surface-variant text-on-surface-variant font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-high active:scale-95 transition-all" onclick="appendValue(')')">)</button>
<!-- Row 2 -->
<button class="bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('7')">7</button>
<button class="bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('8')">8</button>
<button class="bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('9')">9</button>
<button class="bg-primary-container text-on-primary-container font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-primary-container/90 active:scale-95 transition-all" onclick="appendValue('/')">÷</button>
<!-- Row 3 -->
<button class="bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('4')">4</button>
<button class="bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('5')">5</button>
<button class="bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('6')">6</button>
<button class="bg-primary-container text-on-primary-container font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-primary-container/90 active:scale-95 transition-all" onclick="appendValue('*')">×</button>
<!-- Row 4 -->
<button class="bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('1')">1</button>
<button class="bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('2')">2</button>
<button class="bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('3')">3</button>
<button class="bg-primary-container text-on-primary-container font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-primary-container/90 active:scale-95 transition-all" onclick="appendValue('-')">−</button>
<!-- Row 5 -->
<button class="col-span-2 bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('0')">0</button>
<button class="bg-surface-container-lowest text-on-surface font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-surface-container-lowest/90 active:scale-95 transition-all" onclick="appendValue('.')">.</button>
<button class="bg-primary-container text-on-primary-container font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-primary-container/90 active:scale-95 transition-all" onclick="appendValue('+')">+</button>
<!-- Row 6 -->
<button class="col-span-4 bg-primary text-on-primary font-button-text text-button-text py-4 rounded-lg shadow-sm hover:bg-primary/90 active:scale-95 transition-all" onclick="calculateResult()">=</button>
</div>
</div>
<!-- Code Explorer Section -->
<div class="w-full max-w-2xl bg-surface-container rounded-xl shadow-sm border border-outline-variant p-6 mb-24 md:mb-8">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-tertiary">code</span>
<h2 class="font-button-text text-button-text text-on-surface">Code Explorer</h2>
</div>
<p class="font-label-md text-label-md text-on-surface-variant mb-4">See how the calculator thinks! This area will explain the math logic line by line as you type.</p>
<div class="bg-surface-container-lowest rounded-lg p-4 font-mono text-sm text-secondary border border-outline-variant h-32 overflow-y-auto">
<div id="code-log">
                    // Ready for input...
                </div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden shadow-sm bg-surface-container dark:bg-surface-container-highest fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 rounded-t-xl pb-6">
<button class="text-on-surface-variant dark:text-on-surface-variant flex flex-col items-center justify-center p-2 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-all active:scale-98">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-md text-label-md text-[10px] mt-1">History</span>
</button>
<button class="bg-primary-container text-on-primary-container rounded-full p-2 flex flex-col items-center justify-center active:scale-98 transition-all duration-200 shadow-sm w-16 h-16 -mt-6">
<span class="material-symbols-outlined text-3xl filled-icon" data-icon="calculate">calculate</span>
</button>
<button class="text-on-surface-variant dark:text-on-surface-variant flex flex-col items-center justify-center p-2 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-all active:scale-98">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-md text-label-md text-[10px] mt-1">Settings</span>
</button>
</nav>
<script>
        let currentExpression = '';
        const mainDisplay = document.getElementById('main-display');
        const historyDisplay = document.getElementById('history-display');
        const errorToast = document.getElementById('error-toast');
        const codeLog = document.getElementById('code-log');
        let justCalculated = false;

        function logAction(action) {
            const p = document.createElement('div');
            p.textContent = action;
            codeLog.appendChild(p);
            codeLog.scrollTop = codeLog.scrollHeight;
        }

        function updateDisplay() {
            if (currentExpression === '') {
                mainDisplay.textContent = '0';
            } else {
                mainDisplay.textContent = currentExpression.replace(/\*/g, '×').replace(/\//g, '÷');
            }
        }

        function appendValue(val) {
            hideError();
            
            if (val === 'C') {
                currentExpression = '';
                historyDisplay.textContent = '';
                logAction('// Cleared display');
                justCalculated = false;
            } else {
                if (justCalculated && /[0-9.]/.test(val)) {
                    currentExpression = val;
                    historyDisplay.textContent = '';
                    logAction(`// Started new calculation with ${val}`);
                } else {
                    currentExpression += val;
                    logAction(`// Appended '${val}' -> Expression: ${currentExpression}`);
                }
                justCalculated = false;
            }
            updateDisplay();
        }

        function showError(message) {
            errorToast.textContent = message;
            errorToast.classList.remove('hidden');
            setTimeout(() => {
                errorToast.classList.add('hidden');
            }, 3000);
        }

        function hideError() {
            errorToast.classList.add('hidden');
        }

        function calculateResult() {
            if (currentExpression === '') return;

            try {
                // Safety check: only allow math characters
                if (!/^[0-9+\-*/(). ]+$/.test(currentExpression)) {
                    throw new Error("Invalid characters");
                }

                historyDisplay.textContent = currentExpression.replace(/\*/g, '×').replace(/\//g, '÷') + ' =';
                logAction(`// Calculating: eval('${currentExpression}')`);
                
                // Using eval is safe here because we strictly verified the input string above
                let result = eval(currentExpression);
                
                // Handle floating point weirdness
                if (!Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(8));
                }

                if (!isFinite(result) || isNaN(result)) {
                    throw new Error("Math Error");
                }

                currentExpression = result.toString();
                logAction(`// Result: ${result}`);
                justCalculated = true;
                updateDisplay();

            } catch (error) {
                logAction(`// Error: ${error.message}`);
                showError("Invalid Math Logic");
                currentExpression = '';
                updateDisplay();
            }
        }
    </script>
</body></html>
